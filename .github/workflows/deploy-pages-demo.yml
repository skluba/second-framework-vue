# Serves the Vite *production* bundle from dist/. If Pages "Source" is set to
# "Deploy from a branch", GitHub will serve repo-root index.html (dev entry
# /src/main.ts) instead — use Settings → Pages → GitHub Actions only.
name: Deploy GitHub Pages (demo)

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Production build (GitHub Pages base path)
        run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - name: Verify bundle is not dev index.html
        run: |
          if grep -qE 'src/main\.ts|/src/main' dist/index.html; then
            echo '::error::dist/index.html still references Vite dev entry. Pages must deploy this workflow artifact, not "Deploy from a branch".' >&2
            cat dist/index.html >&2
            exit 1
          fi
          echo "OK: production index references built assets under /${{ github.event.repository.name }}/"

      - name: SPA deep-link fallback (404 → index)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
