sonar.organization=skluba
sonar.projectKey=skluba_second-framework-vue
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=e2e,src
sonar.test.inclusions=e2e/**/*.ts,src/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=**/*.spec.ts,e2e/**,src/test/**,src/main.ts,src/vite-env.d.ts
